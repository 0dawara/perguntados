server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # Redireciona qualquer URL não encontrada para o index.html
        # Isso é fundamental para rotas do Flutter Web (Single Page Application) funcionarem ao recarregar a página.
        try_files $uri $uri/ /index.html;
    }

    # Configurações adicionais de cache para arquivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
